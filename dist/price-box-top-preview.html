<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Podgląd — aktualne ceny skupu</title>
  <style>html,body,iframe{margin:0;width:100%;height:100%;border:0;background:#f8faf9}iframe{display:block}</style>
</head>
<body>
  <iframe id="site" src="studio.html?page=start" title="Podgląd strony z boksem aktualnych cen"></iframe>
  <script>
    const frame=document.getElementById('site');
    const fallback={800:2.99,925:4.16,999:5.98};
    frame.addEventListener('load',async()=>{
      const doc=frame.contentDocument;
      if(!doc||doc.getElementById('price-box-preview'))return;
      let prices=fallback;
      try{const response=await fetch('ceny-live.json?site=silver',{cache:'no-store'}),data=await response.json();prices=Object.fromEntries(Object.entries(data.metals.silver.purities).map(([key,value])=>[key,value.price]));}catch{}
      const format=value=>new Intl.NumberFormat('pl-PL',{minimumFractionDigits:2,maximumFractionDigits:2}).format(value);
      const box=doc.createElement('section');
      box.id='price-box-preview';
      box.innerHTML=`<span>AKTUALNE CENY SKUPU</span><div><b>Próba 800 <strong>${format(prices[800])} zł<small>/ g</small></strong></b><b>Próba 925 <strong>${format(prices[925])} zł<small>/ g</small></strong></b><b>Próba 999 <strong>${format(prices[999])} zł<small>/ g</small></strong></b></div>`;
      const style=doc.createElement('style');
      style.textContent=`#price-box-preview{width:min(1360px,calc(100% - 88px));box-sizing:border-box;margin:22px auto -4px;padding:18px 24px;border:1px solid #b7d2c4;border-radius:16px;background:linear-gradient(135deg,#fff,#edf6f1);display:flex;align-items:center;gap:36px;box-shadow:0 10px 30px #30504012}#price-box-preview>span{font:800 12px Arial;letter-spacing:.13em;color:#315846;white-space:nowrap}#price-box-preview>div{display:flex;flex:1;justify-content:space-around;gap:18px}#price-box-preview b{font:600 13px Arial;color:#52665d;display:flex;gap:10px;align-items:baseline}#price-box-preview strong{font:800 22px Georgia;color:#284f40}#price-box-preview small{font:400 12px Arial;color:#60766b;margin-left:3px}@media(max-width:800px){#price-box-preview{width:calc(100% - 36px);margin:18px auto 0;padding:14px 12px;display:block}#price-box-preview>span{display:block;margin-bottom:12px;font-size:10px}#price-box-preview>div{gap:8px;justify-content:space-between}#price-box-preview b{display:grid;gap:3px;font-size:11px}#price-box-preview strong{font-size:16px}#price-box-preview small{font-size:10px}}`;
      doc.head.append(style);
      doc.getElementById('start').after(box);
    });
  </script>
</body>
</html>
