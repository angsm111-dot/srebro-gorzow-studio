name: Compare public JDM website
on:
  push:
    branches: [main]
    paths:
      - deployment/jdm-public/**
      - scripts/compare-jdm-public.py
      - scripts/audit-indexing-access.py
      - scripts/compare-site-seo.py
      - .github/workflows/jdm-public-compare.yml
  workflow_dispatch:
  workflow_run:
    workflows: ["JDM — compare or deploy"]
    types: [completed]
    branches: [main]
permissions:
  contents: write
concurrency:
  group: jdm-public-comparison
  cancel-in-progress: false
jobs:
  compare:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install read-only download tools
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends sshpass rsync
      - name: Download only public resource types over authenticated SSH
        env:
          SSHPASS: ${{ secrets.JDM_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          python3 - <<'PYTHON'
          from pathlib import Path
          root = Path('deployment/jdm-public')
          allowed = {'.html', '.css', '.js', '.xml', '.png', '.jpg', '.jpeg', '.webp', '.svg', '.ico'}
          names = [p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()
                   and p.suffix.lower() in allowed and p.name != 'studio.html'
                   and not any(part.startswith('.') or part == 'private-config' for part in p.relative_to(root).parts)]
          Path('/tmp/public-files.txt').write_text('\n'.join(sorted(names)) + '\n')
          PYTHON
          mkdir -p "$HOME/.ssh" /tmp/jdm-snapshot
          chmod 700 "$HOME/.ssh"
          export RSYNC_RSH='sshpass -e ssh -p 2233 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=15'
          transfer_status=0
          rsync --recursive --files-from=/tmp/public-files.txt \
            'smxkojwd@web15.jdm.pl:/home/smxkojwd/public_html/' /tmp/jdm-snapshot/ || transfer_status=$?
          # Missing remote resources are recorded individually by the comparison.
          if [[ $transfer_status -ne 0 && $transfer_status -ne 23 ]]; then
            exit "$transfer_status"
          fi
      - name: Read public robots.txt if present on origin
        env:
          SSHPASS: ${{ secrets.JDM_SSH_PASSWORD }}
        run: |
          export RSYNC_RSH='sshpass -e ssh -p 2233 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20'
          rsync --ignore-missing-args 'smxkojwd@web15.jdm.pl:/home/smxkojwd/public_html/robots.txt' /tmp/jdm-snapshot/
      - name: Check HTTP indexing access
        run: python3 scripts/audit-indexing-access.py
      - name: Compare public SEO signals of both websites
        run: python3 scripts/compare-site-seo.py
      - name: Compare downloaded files without changing JDM
        env:
          JDM_SNAPSHOT_DIR: /tmp/jdm-snapshot
        run: python3 scripts/compare-jdm-public.py
      - name: Save public comparison report on separate branch
        shell: bash
        run: |
          set -euo pipefail
          if git fetch origin jdm-public-comparison; then
            git switch --create jdm-public-comparison FETCH_HEAD
          else
            git switch --orphan jdm-public-comparison
          fi
          cp /tmp/jdm-comparison.json comparison.json
          cp /tmp/jdm-comparison.diff comparison.diff
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp /tmp/jdm-access-audit.json access-audit.json
          cp /tmp/site-seo-comparison.json site-seo-comparison.json
          for file in /tmp/skupsrebra-home.html /tmp/srebro-home.html /tmp/srebro-www-home.html; do if test -f "$file"; then cp "$file" .; git add "$(basename "$file")"; fi; done
          git add comparison.json comparison.diff access-audit.json site-seo-comparison.json
          if ! git diff --cached --quiet; then
            git commit -m 'Report public JDM comparison'
            git push origin HEAD:jdm-public-comparison
          fi
