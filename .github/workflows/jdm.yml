name: JDM — compare or deploy

on:
  push:
    branches: [main]
    paths:
      - deployment/jdm-public/**
      - .github/workflows/jdm.yml
      - scripts/jdm-sync.sh
      - scripts/verify-production.py
  workflow_dispatch:
    inputs:
      mode:
        description: 'compare = only list differences; deploy = upload changed files'
        type: choice
        options:
          - compare
          - deploy
        default: compare
        required: true

permissions:
  contents: write

concurrency:
  group: jdm-production
  cancel-in-progress: false

jobs:
  jdm:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate repository
        run: |
          npm test
          python3 scripts/verify-production.py
      - name: Install transfer tools
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends sshpass rsync
      - name: Compare or publish production files
        env:
          SSHPASS: ${{ secrets.JDM_SSH_PASSWORD }}
          JDM_MODE: ${{ github.event_name == 'push' && 'deploy' || inputs.mode }}
        run: |
          set -o pipefail
          bash scripts/jdm-sync.sh 2>&1 | tee /tmp/jdm-deployment.log
      - name: Record deployment result
        if: always()
        env:
          DEPLOYMENT_RESULT: ${{ job.status }}
          DEPLOYMENT_MODE: ${{ github.event_name == 'push' && 'deploy' || inputs.mode }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          Path('/tmp/jdm-deployment.json').write_text(json.dumps({
              'commit': os.environ['GITHUB_SHA'],
              'mode': os.environ['DEPLOYMENT_MODE'],
              'result': os.environ['DEPLOYMENT_RESULT'],
              'run_url': os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID']
          }, indent=2))
          PYTHON
          if git fetch origin jdm-deployment-status; then
            git switch --create jdm-deployment-status FETCH_HEAD
          else
            git switch --orphan jdm-deployment-status
          fi
          cp /tmp/jdm-deployment.json deployment.json
          if test -f /tmp/jdm-deployment.log; then cp /tmp/jdm-deployment.log deployment.log; else echo "Transfer step did not execute." > deployment.log; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment.json deployment.log
          git diff --cached --quiet || git commit -m 'Record JDM deployment result'
          git push origin HEAD:jdm-deployment-status
